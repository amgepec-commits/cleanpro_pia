name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - name: Pruebas + cobertura (falla si < 80%)
        run: pytest
      - name: Evidencia de fixtures del profesor
        if: always()
        run: python scripts/run_fixtures.py || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evidencia-qa
          path: |
            coverage.xml
            docs/evidencia/

  docker:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Preparar .env desde .env.example
        run: cp .env.example .env
      - name: Construir imágenes
        run: docker compose build
      - name: Correr pruebas dentro de Docker Compose (DB + tests)
        run: docker compose --profile test run --rm tests

  deploy:
    runs-on: ubuntu-latest
    needs: [tests, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Disparar despliegue (Render deploy hook)
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "Sin RENDER_DEPLOY_HOOK_URL: se omite (Render/Railway pueden auto-desplegar desde GitHub)."
          else
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"
          fi
